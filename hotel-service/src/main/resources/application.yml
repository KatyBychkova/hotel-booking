server:
  port: 8081
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
logging:
  structured:
    format:
      console: logstash
app:
  jwt-secret: ${JWT_SECRET}
